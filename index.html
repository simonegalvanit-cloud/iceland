<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --night-1: #020810;
    --night-2: #0a1628;
    --aurora-1: #2dd4bf;
    --aurora-2: #06b6d4;
    --aurora-3: #8b5cf6;
    --aurora-4: #ec4899;
    --glow: rgba(45, 212, 191, 0.4);
  }

  html {
    scroll-behavior: smooth;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  html::-webkit-scrollbar { display: none; }

  body {
    background: var(--night-1);
    color: #f0ede8;
    font-family: 'Outfit', sans-serif;
    overflow-x: hidden;
    cursor: default;
  }

  canvas#bgCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
  }

  /* ====== SECTION 1: ARE YOU READY ====== */
  .s1 {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .ready-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    font-weight: 400;
    font-style: italic;
    letter-spacing: 2px;
    text-align: center;
    opacity: 0;
    animation: breatheIn 2.5s ease forwards;
    text-shadow: 0 0 60px rgba(45, 212, 191, 0.2), 0 0 120px rgba(139, 92, 246, 0.1);
  }

  @keyframes breatheIn {
    0% { opacity: 0; transform: scale(0.92); filter: blur(8px); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  .ready-sub {
    font-size: clamp(0.8rem, 2vw, 1rem);
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(240, 237, 232, 0.3);
    margin-top: 30px;
    opacity: 0;
    animation: fadeIn 1.5s ease 2s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .scroll-line {
    position: absolute;
    bottom: 50px;
    width: 1px;
    height: 60px;
    background: linear-gradient(to bottom, transparent, var(--aurora-1), transparent);
    opacity: 0;
    animation: fadeIn 1s ease 2.8s forwards, scrollPulse 2s ease-in-out 3s infinite;
  }

  @keyframes scrollPulse {
    0%, 100% { transform: scaleY(1); opacity: 0.4; }
    50% { transform: scaleY(1.5); opacity: 0.8; }
  }

  /* ====== SECTION 2: THE REVEAL ====== */
  .s2 {
    height: 300vh;
    position: relative;
  }

  .s2-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .reveal-container {
    position: relative;
    text-align: center;
  }

  .reveal-iceland {
    font-family: 'Playfair Display', serif;
    font-size: clamp(4rem, 15vw, 12rem);
    font-weight: 700;
    letter-spacing: clamp(8px, 3vw, 30px);
    line-height: 1;
    background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2), var(--aurora-3), var(--aurora-4));
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 5s ease infinite;
    opacity: 0;
    transform: translateY(60px) scale(0.7);
    transition: all 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    filter: blur(20px);
    will-change: transform, opacity, filter;
  }

  .reveal-iceland.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .reveal-year {
    font-family: 'Outfit', sans-serif;
    font-weight: 200;
    font-size: clamp(1.2rem, 4vw, 2.5rem);
    letter-spacing: clamp(10px, 4vw, 35px);
    margin-top: 10px;
    opacity: 0;
    transform: translateY(30px);
    transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
    color: rgba(240, 237, 232, 0.7);
  }

  .reveal-year.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Glow ring behind the text */
  .glow-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 0; height: 0;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
    opacity: 0;
    transition: all 1.8s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: -1;
  }

  .glow-ring.visible {
    width: 140vw;
    height: 140vw;
    opacity: 0.3;
  }

  /* Horizontal reveal lines */
  .h-line {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--aurora-1), var(--aurora-2), transparent);
    width: 0;
    transition: width 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s;
    left: 50%;
    transform: translateX(-50%);
  }
  .h-line.top { top: -30px; }
  .h-line.bottom { bottom: -30px; }
  .h-line.visible { width: min(80vw, 700px); }

  /* ====== SECTION 3: SKETCH IMAGE ====== */
  .s3 {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 24px;
    position: relative;
  }

  .sketch-frame {
    position: relative;
    max-width: 650px;
    width: 90%;
    opacity: 0;
    transform: translateY(50px) rotate(-1deg);
    transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .sketch-frame.visible {
    opacity: 1;
    transform: translateY(0) rotate(-1deg);
  }

  .sketch-frame img {
    width: 100%;
    border-radius: 8px;
    box-shadow:
      0 25px 80px rgba(0,0,0,0.6),
      0 0 100px rgba(45, 212, 191, 0.08),
      0 0 200px rgba(139, 92, 246, 0.05);
  }

  .sketch-frame::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--aurora-1), var(--aurora-3), var(--aurora-4), var(--aurora-2));
    background-size: 300% 300%;
    animation: shimmer 4s ease infinite;
    z-index: -1;
    opacity: 0.5;
  }

  /* floating particles around sketch */
  .particle-field {
    position: absolute;
    inset: -100px;
    pointer-events: none;
    z-index: -1;
  }

  .particle {
    position: absolute;
    width: var(--size);
    height: var(--size);
    background: var(--color);
    border-radius: 50%;
    opacity: 0;
    animation: floatParticle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  @keyframes floatParticle {
    0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
    30% { opacity: 0.6; }
    70% { opacity: 0.4; }
    50% { opacity: 0.8; transform: translateY(var(--drift)) scale(1); }
  }

  /* ====== SHOOTING STARS (CSS) ====== */
  .shooting-star {
    position: fixed;
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, white, transparent);
    opacity: 0;
    z-index: 0;
    animation: shoot var(--dur) linear infinite;
    animation-delay: var(--delay);
    top: var(--top);
    left: var(--left);
    transform: rotate(var(--angle));
  }

  @keyframes shoot {
    0% { opacity: 0; transform: translateX(0) rotate(var(--angle)); }
    2% { opacity: 0.8; }
    8% { opacity: 0; transform: translateX(400px) rotate(var(--angle)); }
    100% { opacity: 0; }
  }

  /* ====== CURSOR GLOW ====== */
  .cursor-glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(45, 212, 191, 0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    transform: translate(-50%, -50%);
    transition: left 0.3s ease, top 0.3s ease;
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="cursor-glow" id="cursorGlow"></div>

<!-- Shooting stars -->
<div class="shooting-star" style="--dur:8s;--delay:1s;--top:15%;--left:10%;--angle:-15deg;"></div>
<div class="shooting-star" style="--dur:12s;--delay:4s;--top:25%;--left:60%;--angle:-20deg;"></div>
<div class="shooting-star" style="--dur:10s;--delay:7s;--top:8%;--left:30%;--angle:-10deg;"></div>
<div class="shooting-star" style="--dur:15s;--delay:2s;--top:35%;--left:75%;--angle:-25deg;"></div>
<div class="shooting-star" style="--dur:9s;--delay:9s;--top:12%;--left:50%;--angle:-12deg;"></div>

<div class="content">

  <!-- SECTION 1 -->
  <section class="s1">
    <h1 class="ready-text">are you ready?</h1>
    <p class="ready-sub">scroll down</p>
    <div class="scroll-line"></div>
  </section>

  <!-- SECTION 2 -->
  <section class="s2">
    <div class="s2-sticky">
      <div class="reveal-container">
        <div class="glow-ring" id="glowRing"></div>
        <div class="h-line top" id="hLineTop"></div>
        <h2 class="reveal-iceland" id="revealText">ICELAND</h2>
        <p class="reveal-year" id="revealYear">2 0 2 6</p>
        <div class="h-line bottom" id="hLineBottom"></div>
      </div>
    </div>
  </section>

  <!-- SECTION 3 -->
  <section class="s3">
    <div class="sketch-frame" id="sketchFrame">
      <div class="particle-field" id="particleField"></div>
      <img src="sketch.jpg" alt="Our adventure awaits">
    </div>
  </section>

</div>

<script>
// ====== STARFIELD CANVAS ======
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let w, h, stars = [], mouseX = 0, mouseY = 0;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Create stars
for (let i = 0; i < 350; i++) {
  stars.push({
    x: Math.random() * 3000 - 500,
    y: Math.random() * 3000 - 500,
    z: Math.random() * 1500,
    size: Math.random() * 1.8 + 0.3,
    baseAlpha: Math.random() * 0.6 + 0.2,
    twinkleSpeed: Math.random() * 0.02 + 0.005,
    twinkleOffset: Math.random() * Math.PI * 2
  });
}

// Aurora layers
const auroraLayers = [
  { color: 'rgba(45, 212, 191, 0.03)', y: 0.15, speed: 0.0003, amp: 80 },
  { color: 'rgba(6, 182, 212, 0.025)', y: 0.2, speed: 0.0005, amp: 60 },
  { color: 'rgba(139, 92, 246, 0.02)', y: 0.12, speed: 0.0004, amp: 100 },
  { color: 'rgba(236, 72, 153, 0.015)', y: 0.18, speed: 0.00035, amp: 70 },
];

let time = 0;

function drawAurora(t) {
  auroraLayers.forEach(layer => {
    ctx.beginPath();
    ctx.moveTo(0, h);
    for (let x = 0; x <= w; x += 4) {
      const y = h * layer.y +
        Math.sin(x * 0.003 + t * layer.speed * 1000) * layer.amp +
        Math.sin(x * 0.007 + t * layer.speed * 500) * (layer.amp * 0.5) +
        Math.cos(x * 0.001 + t * layer.speed * 300) * (layer.amp * 0.8);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, h);
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, 0, 0, h * 0.5);
    grad.addColorStop(0, layer.color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fill();
  });
}

function animate(t) {
  time = t;
  ctx.clearRect(0, 0, w, h);

  // Gradient sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
  skyGrad.addColorStop(0, '#010510');
  skyGrad.addColorStop(0.4, '#06101f');
  skyGrad.addColorStop(1, '#0a1628');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, w, h);

  // Aurora
  drawAurora(t);

  // Stars with parallax
  const scrollY = window.scrollY;
  const parallaxX = (mouseX - w / 2) * 0.01;
  const parallaxY = (mouseY - h / 2) * 0.01;

  stars.forEach(star => {
    const depth = star.z / 1500;
    const px = (star.x - parallaxX * (1 - depth) * 30) % w;
    const py = (star.y - scrollY * depth * 0.15 - parallaxY * (1 - depth) * 20) % h;
    const sx = ((px % w) + w) % w;
    const sy = ((py % h) + h) % h;

    const twinkle = Math.sin(t * star.twinkleSpeed + star.twinkleOffset);
    const alpha = star.baseAlpha + twinkle * 0.3;
    const size = star.size * (0.8 + twinkle * 0.2);

    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(size, 0.3), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(240, 237, 232, ${Math.max(alpha, 0.05)})`;
    ctx.fill();

    // Glow on brighter stars
    if (star.size > 1.2) {
      ctx.beginPath();
      ctx.arc(sx, sy, size * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 230, 255, ${alpha * 0.08})`;
      ctx.fill();
    }
  });

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// Mouse tracking
document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  const glow = document.getElementById('cursorGlow');
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
});

// ====== SCROLL REVEAL ======
const s2 = document.querySelector('.s2');
const revealText = document.getElementById('revealText');
const revealYear = document.getElementById('revealYear');
const glowRing = document.getElementById('glowRing');
const hLineTop = document.getElementById('hLineTop');
const hLineBottom = document.getElementById('hLineBottom');
const sketchFrame = document.getElementById('sketchFrame');

let revealed = false;

function onScroll() {
  const s2Rect = s2.getBoundingClientRect();
  const progress = Math.max(0, Math.min(1, -s2Rect.top / (s2Rect.height - window.innerHeight)));

  if (progress > 0.1 && !revealed) {
    revealed = true;
    revealText.classList.add('visible');
    revealYear.classList.add('visible');
    glowRing.classList.add('visible');
    hLineTop.classList.add('visible');
    hLineBottom.classList.add('visible');
  }

  // Sketch reveal
  const sketchRect = sketchFrame.getBoundingClientRect();
  if (sketchRect.top < window.innerHeight * 0.8) {
    sketchFrame.classList.add('visible');
  }
}

window.addEventListener('scroll', onScroll);

// ====== FLOATING PARTICLES around sketch ======
const pf = document.getElementById('particleField');
const colors = ['var(--aurora-1)', 'var(--aurora-2)', 'var(--aurora-3)', 'var(--aurora-4)'];
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.top = Math.random() * 100 + '%';
  p.style.setProperty('--size', (2 + Math.random() * 4) + 'px');
  p.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
  p.style.setProperty('--dur', (4 + Math.random() * 6) + 's');
  p.style.setProperty('--delay', (Math.random() * 5) + 's');
  p.style.setProperty('--drift', (-30 - Math.random() * 40) + 'px');
  pf.appendChild(p);
}
</script>

</body>
</html>
