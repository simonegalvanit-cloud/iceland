<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENTUM — Packaging</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#09080a;
  min-height:100vh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  overflow:hidden;
  font-family:Georgia,serif;
}
body::before {
  content:''; position:fixed; inset:0;
  background:radial-gradient(ellipse 55% 40% at 50% 55%, rgba(201,168,92,.08) 0%, transparent 70%);
  pointer-events:none;
}

/* ── TOP NAV ── */
#nav {
  position:fixed; top:0; left:0; right:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 28px;
  z-index:100;
}
#nav-title {
  color:rgba(201,168,92,.35);
  font-size:10px; letter-spacing:6px;
  text-transform:uppercase; font-style:italic;
}
#nav-btns { display:flex; gap:8px; }
.nav-btn {
  background:transparent;
  border:1px solid rgba(201,168,92,.28);
  color:rgba(201,168,92,.55);
  font-family:Georgia,serif; font-size:9px;
  letter-spacing:3px; padding:7px 16px;
  cursor:pointer; text-transform:uppercase; transition:all .2s;
}
.nav-btn:hover { border-color:#c9a85c; color:#c9a85c; background:rgba(201,168,92,.05); }
.nav-btn.active { border-color:#c9a85c; color:#c9a85c; background:rgba(201,168,92,.1); }

/* ══════════════════════════════════
   3D VIEW
══════════════════════════════════ */
#view-3d {
  display:flex; align-items:center; justify-content:center;
  width:100vw; height:100vh;
}
#stage {
  perspective:850px;
  perspective-origin:50% 46%;
  width:200px; height:280px;
}
#wrap {
  width:200px; height:280px;
  position:relative;
  transform-style:preserve-3d;
  cursor:grab;
}
#wrap:active { cursor:grabbing; }
.face {
  position:absolute; top:0; left:0;
  backface-visibility:hidden;
}
#front {
  width:200px; height:282px; top:-1px;
  transform:translateZ(100px);
  background:#0d0c0a;
  border:1px solid rgba(201,168,92,.28);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px;
}
#front::before { content:''; position:absolute; inset:8px; border:.5px solid rgba(201,168,92,.15); pointer-events:none; }
#front::after  { content:''; position:absolute; inset:0; background:linear-gradient(130deg,rgba(255,255,255,.022) 0%,transparent 50%); pointer-events:none; }
#back {
  width:200px; height:282px; top:-1px;
  transform:rotateY(180deg) translateZ(100px);
  background:#0b0a08; border:1px solid rgba(201,168,92,.2); padding:30px 22px;
}
#back::before { content:''; position:absolute; inset:8px; border:.5px solid rgba(201,168,92,.12); pointer-events:none; }
#right {
  width:200px; height:282px; top:-1px;
  transform:rotateY(90deg) translateZ(100px);
  background:#0c0b09; border:1px solid rgba(201,168,92,.18);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
}
#left {
  width:200px; height:282px; top:-1px;
  transform:rotateY(-90deg) translateZ(100px);
  background:#0b0a08; border:1px solid rgba(201,168,92,.15);
  display:flex; align-items:center; justify-content:center;
}
#top {
  width:200px; height:200px; top:0; left:0;
  transform:rotateX(90deg) translateZ(140px);
  background:linear-gradient(145deg,#181614 0%,#0f0e0c 100%);
  box-shadow:inset 0 0 0 1px rgba(201,168,92,.24);
  display:flex; align-items:center; justify-content:center; overflow:visible;
}
#top::before { content:''; position:absolute; inset:8px; border:.5px solid rgba(201,168,92,.18); pointer-events:none; }
#top::after {
  content:''; position:absolute; bottom:-18px; left:50%; transform:translateX(-50%);
  width:140px; height:20px; background:#0f0e0c;
  border:1px solid rgba(201,168,92,.22); border-top:none; border-radius:0 0 70px 70px;
}
#bottom {
  width:200px; height:200px; top:0;
  transform:rotateX(-90deg) translateZ(140px);
  background:#08080a; border:1px solid rgba(201,168,92,.12);
}
.brand { color:#c9a85c; font-size:21px; font-weight:bold; letter-spacing:7px; text-shadow:0 0 28px rgba(201,168,92,.25); }
.tag   { color:rgba(201,168,92,.48); font-size:7.5px; letter-spacing:2px; font-style:italic; text-align:center; line-height:1.9; }
.back-title { color:#c9a85c; font-size:9px; font-weight:bold; letter-spacing:4px; margin-bottom:14px; }
.back-body  { color:rgba(201,168,92,.44); font-size:7px; letter-spacing:1.5px; font-style:italic; line-height:2.3; }
.side-v { color:#c9a85c; font-size:10px; font-weight:bold; letter-spacing:5px; writing-mode:vertical-rl; transform:rotate(180deg); }
.side-s { color:rgba(201,168,92,.3); font-size:6px; letter-spacing:2px; font-style:italic; writing-mode:vertical-rl; transform:rotate(180deg); }

/* ══════════════════════════════════
   DIELINE VIEW
══════════════════════════════════ */
#view-dieline {
  display:none;
  align-items:center; justify-content:center;
  width:100vw; height:100vh;
  overflow:auto;
}
#dieline-wrap {
  position:relative;
  transform-origin: top center;
}
.dp {
  position:absolute;
  background:#0d0c0a;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.dp { outline:1.5px solid #c9a85c; }
.fold-h, .fold-v {
  position:absolute;
  background: repeating-linear-gradient(90deg,rgba(201,168,92,.6) 0px,rgba(201,168,92,.6) 6px,transparent 6px,transparent 12px);
  height:1px;
}
.fold-v {
  background: repeating-linear-gradient(180deg,rgba(201,168,92,.6) 0px,rgba(201,168,92,.6) 6px,transparent 6px,transparent 12px);
  width:1px; height:auto;
}
#dieline-legend {
  position:absolute;
  bottom:-50px; left:0;
  display:flex; gap:24px; align-items:center;
}
.leg { display:flex; align-items:center; gap:8px; color:rgba(201,168,92,.5); font-size:10px; letter-spacing:2px; }
.leg-cut  { width:32px; height:1.5px; background:#c9a85c; }
.leg-fold { width:32px; height:1px;
  background: repeating-linear-gradient(90deg,rgba(201,168,92,.7) 0,rgba(201,168,92,.7) 5px,transparent 5px,transparent 10px);
}
.panel-label {
  position:absolute; top:8px; left:0; right:0;
  text-align:center;
  color:rgba(201,168,92,.3); font-size:9px; letter-spacing:3px;
  text-transform:uppercase; font-style:italic;
  pointer-events:none;
}
#dl-hint {
  position:absolute; bottom:-80px; left:0; right:0;
  text-align:center;
  color:rgba(201,168,92,.28); font-size:9px; letter-spacing:3px;
  font-style:italic;
}
</style>
</head>
<body>

<!-- NAV -->
<div id="nav">
  <div id="nav-title">CENTUM — Packaging</div>
  <div id="nav-btns">
    <button class="nav-btn active" id="btn3d">3D Preview</button>
    <button class="nav-btn" id="btnDieline">Dieline</button>
    <button class="nav-btn" id="btnPDF" style="display:none; border-color:rgba(201,168,92,.5);">↓ Download PDF</button>
  </div>
</div>

<!-- ══ 3D VIEW ══ -->
<div id="view-3d">
  <div id="stage">
    <div id="wrap">
      <div class="face" id="front">
        <svg width="36" height="36" viewBox="0 0 36 36">
          <ellipse cx="18" cy="18" rx="16" ry="5.2" fill="none" stroke="#c9a85c" stroke-width="1.3" transform="rotate(-32 18 18)"/>
          <ellipse cx="18" cy="18" rx="16" ry="5.2" fill="none" stroke="#c9a85c" stroke-width="1.3" transform="rotate(32 18 18)"/>
          <circle cx="18" cy="18" r="3.6" fill="#c9a85c"/>
          <circle cx="18" cy="18" r="1.5" fill="#0d0c0a"/>
          <circle cx="33.5" cy="13" r="1.2" fill="#c9a85c" opacity=".6"/>
          <circle cx="2.5"  cy="23" r="1.2" fill="#c9a85c" opacity=".4"/>
        </svg>
        <div class="brand">CENTUM</div>
        <div class="tag">Small batch,<br>Italian roasted.</div>
      </div>
      <div class="face" id="back">
        <div class="back-title">CENTUM</div>
        <div class="back-body">
          Volume: ★★★★★<br><br>
          Specialty Coffee<br>
          Illuminated in Italy
        </div>
        <svg style="position:absolute;bottom:20px;right:18px;opacity:.2" width="22" height="22" viewBox="0 0 36 36">
          <ellipse cx="18" cy="18" rx="16" ry="5.2" fill="none" stroke="#c9a85c" stroke-width="1.3" transform="rotate(-32 18 18)"/>
          <ellipse cx="18" cy="18" rx="16" ry="5.2" fill="none" stroke="#c9a85c" stroke-width="1.3" transform="rotate(32 18 18)"/>
          <circle cx="18" cy="18" r="3.6" fill="#c9a85c"/>
        </svg>
      </div>
      <div class="face" id="right">
        <div class="side-v">CENTUM</div>
        <div class="side-s">Est. MMXXIV · Single Origin</div>
      </div>
      <div class="face" id="left">
        <svg width="22" height="22" viewBox="0 0 36 36" opacity=".25">
          <ellipse cx="18" cy="18" rx="16" ry="5.2" fill="none" stroke="#c9a85c" stroke-width="1.3" transform="rotate(-32 18 18)"/>
          <ellipse cx="18" cy="18" rx="16" ry="5.2" fill="none" stroke="#c9a85c" stroke-width="1.3" transform="rotate(32 18 18)"/>
          <circle cx="18" cy="18" r="3.6" fill="#c9a85c"/>
        </svg>
      </div>
      <div class="face" id="top">
        <svg width="26" height="26" viewBox="0 0 36 36" style="opacity:.55">
          <ellipse cx="18" cy="18" rx="16" ry="5.2" fill="none" stroke="#c9a85c" stroke-width="1.3" transform="rotate(-32 18 18)"/>
          <ellipse cx="18" cy="18" rx="16" ry="5.2" fill="none" stroke="#c9a85c" stroke-width="1.3" transform="rotate(32 18 18)"/>
          <circle cx="18" cy="18" r="3.6" fill="#c9a85c"/>
          <circle cx="18" cy="18" r="1.5" fill="#0f0e0c"/>
        </svg>
      </div>
      <div class="face" id="bottom"></div>
    </div>
  </div>
</div>

<!-- ══ DIELINE VIEW ══ -->
<div id="view-dieline">
  <div id="dieline-wrap">
    <svg id="dieline-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="dieline-legend">
      <div class="leg"><div class="leg-cut"></div> Cut line</div>
      <div class="leg"><div class="leg-fold"></div> Fold line</div>
    </div>
    <div id="dl-hint">Print at 1:1 scale · All dimensions in mm shown on fold lines</div>
  </div>
</div>

<script>
// ── 3D SPIN ───────────────────────────────────────────────
const wrap = document.getElementById('wrap');
let rx=-14, ry=30, dragging=false, sx=0, sy=0, srx=0, sry=0, autoRY=30, lastT=null;
function setW(){ wrap.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`; }
function loop(t){
  requestAnimationFrame(loop);
  if(lastT===null) lastT=t;
  if(!dragging){ autoRY+=(t-lastT)*0.02; ry=autoRY; setW(); }
  lastT=t;
}
requestAnimationFrame(loop);
wrap.addEventListener('mousedown',e=>{ dragging=true; sx=e.clientX; sy=e.clientY; srx=rx; sry=ry; e.preventDefault(); });
window.addEventListener('mouseup',()=>{ dragging=false; autoRY=ry; });
window.addEventListener('mousemove',e=>{ if(!dragging)return; ry=sry+(e.clientX-sx)*0.6; rx=Math.max(-35,Math.min(15,srx-(e.clientY-sy)*0.35)); setW(); });
wrap.addEventListener('touchstart',e=>{ dragging=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; srx=rx; sry=ry; },{passive:true});
window.addEventListener('touchend',()=>{ dragging=false; autoRY=ry; });
window.addEventListener('touchmove',e=>{ if(!dragging)return; ry=sry+(e.touches[0].clientX-sx)*0.6; rx=Math.max(-35,Math.min(15,srx-(e.touches[0].clientY-sy)*0.35)); setW(); },{passive:true});

// ── DIELINE SVG ──────────────────────────────────────────
const mm = 3;
const W=60*mm, H=90*mm, D=60*mm;
const TH=32*mm;
const GT=10*mm;

const x0=GT, x1=x0+D, x2=x1+W, x3=x2+D, x4=x3+W;
const y0=TH, y1=y0+H, y2=y1+TH;
const totalW = x4+GT;
const totalH = y2;

const GOLD='#c9a85c';
const DARK='#0d0c0a';
const FOLD='rgba(201,168,92,0.7)';
const CUT='#c9a85c';

const svg = document.getElementById('dieline-svg');
svg.setAttribute('width', totalW);
svg.setAttribute('height', totalH);
svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);

function el(tag, attrs){
  const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  return e;
}
function rect(x,y,w,h,fill,stroke='none',sw=0){
  return el('rect',{x,y,width:w,height:h,fill,stroke,'stroke-width':sw});
}
function line(x1,y1,x2,y2,stroke,sw=1,dash=''){
  return el('line',{x1,y1,x2,y2,stroke,'stroke-width':sw,'stroke-dasharray':dash});
}
function text(txt,x,y,size,fill,anchor='middle',style=''){
  const t=el('text',{x,y,'font-size':size,fill,'text-anchor':anchor,'font-family':'Georgia,serif','font-style':style||'normal'});
  t.textContent=txt; return t;
}
function orbit(cx,cy,r){
  const g=el('g',{});
  [-32,32].forEach(deg=>{
    const e=el('ellipse',{cx,cy,rx:r,ry:r*0.33,fill:'none',stroke:GOLD,'stroke-width':r*0.07,transform:`rotate(${deg} ${cx} ${cy})`});
    g.appendChild(e);
  });
  g.appendChild(el('circle',{cx,cy,r:r*0.22,fill:GOLD}));
  g.appendChild(el('circle',{cx,cy,r:r*0.09,fill:DARK}));
  return g;
}

svg.appendChild(rect(0,0,totalW,totalH,'#111010'));

// glue tab left
svg.appendChild(el('path',{d:`M0,${y0} L${GT},${y0+GT} L${GT},${y1-GT} L0,${y1}`,fill:'#0a0908',stroke:CUT,'stroke-width':1.5}));
svg.appendChild(text('GLUE',GT/2,y0+H/2,7,'rgba(201,168,92,0.3)'));

// left side
svg.appendChild(rect(x0,y0,D,H,DARK));
svg.appendChild(orbit(x0+D/2, y0+H/2, 10));
svg.appendChild(text('LEFT SIDE',x0+D/2,y0+H-14,7,'rgba(201,168,92,.25)','middle','italic'));

// front panel
svg.appendChild(rect(x1,y0,W,H,'#0d0c0a'));
svg.appendChild(rect(x1+8,y0+8,W-16,H-16,'none',`rgba(201,168,92,.18)`,0.5));
svg.appendChild(orbit(x1+W/2, y0+H*0.32, 14));
const ct=text('CENTUM',x1+W/2,y0+H*0.52,16,GOLD);
ct.setAttribute('font-weight','bold'); ct.setAttribute('letter-spacing','5'); svg.appendChild(ct);
svg.appendChild(text('Small batch, Italian roasted.',x1+W/2,y0+H*0.62,7,'rgba(201,168,92,.48)','middle','italic'));
svg.appendChild(text('FRONT PANEL',x1+W/2,y0+H-14,7,'rgba(201,168,92,.25)','middle','italic'));

// right side
svg.appendChild(rect(x2,y0,D,H,DARK));
const rt=text('CENTUM',x2+D/2,y0+H/2,9,GOLD);
rt.setAttribute('font-weight','bold');
rt.setAttribute('transform',`rotate(-90,${x2+D/2},${y0+H/2})`);
rt.setAttribute('letter-spacing','3');
svg.appendChild(rt);
svg.appendChild(text('RIGHT SIDE',x2+D/2,y0+H-14,7,'rgba(201,168,92,.25)','middle','italic'));

// back panel
svg.appendChild(rect(x3,y0,W,H,'#0b0a08'));
svg.appendChild(rect(x3+8,y0+8,W-16,H-16,'none','rgba(201,168,92,.15)',0.5));
const bt=text('CENTUM',x3+14,y0+28,9,GOLD,'start');
bt.setAttribute('font-weight','bold'); bt.setAttribute('letter-spacing','3'); svg.appendChild(bt);
['Volume: ★★★★★','','Specialty Coffee','Illuminated in Italy'].forEach((l,i)=>{
  if(l) svg.appendChild(text(l,x3+14,y0+52+i*16,7,'rgba(201,168,92,.44)','start','italic'));
});
svg.appendChild(orbit(x3+W-20, y0+H-20, 8));
svg.appendChild(text('BACK PANEL',x3+W/2,y0+H-14,7,'rgba(201,168,92,.25)','middle','italic'));

// glue tab right
svg.appendChild(el('path',{d:`M${x4},${y0} L${x4+GT},${y0+GT} L${x4+GT},${y1-GT} L${x4},${y1}`,fill:'#0a0908',stroke:CUT,'stroke-width':1.5}));
svg.appendChild(text('GLUE',x4+GT/2,y0+H/2,7,'rgba(201,168,92,0.3)'));

// top tuck flap
svg.appendChild(el('path',{
  d:`M${x1},0 L${x1+W},0 L${x1+W},${TH} Q${x1+W},${TH+20} ${x1+W/2+50},${TH+22} Q${x1+W/2},${TH+28} ${x1+W/2-50},${TH+22} Q${x1},${TH+20} ${x1},${TH} Z`,
  fill:'#131210', stroke:CUT,'stroke-width':1.5
}));
svg.appendChild(orbit(x1+W/2, TH/2, 8));
svg.appendChild(text('TOP TUCK FLAP',x1+W/2,TH-10,7,'rgba(201,168,92,.25)','middle','italic'));

// top side gussets
[[x0,x1],[x2,x2+D]].forEach(([lx,rx2],i)=>{
  const gw=D, gh=TH*0.75;
  const gx=i===0?x0:x2, gy=TH-gh;
  svg.appendChild(rect(gx,gy,gw,gh,'#0f0e0c',CUT,1.5));
  if(i===0){
    svg.appendChild(el('path',{d:`M${gx},${gy} L${gx+gw},${gy+gh} M${gx},${gy+gh} L${gx+gw},${gy+gh}`,stroke:FOLD,'stroke-width':0.8,'stroke-dasharray':'4,4',fill:'none'}));
  } else {
    svg.appendChild(el('path',{d:`M${gx+gw},${gy} L${gx},${gy+gh} M${gx},${gy+gh} L${gx+gw},${gy+gh}`,stroke:FOLD,'stroke-width':0.8,'stroke-dasharray':'4,4',fill:'none'}));
  }
});

// bottom tuck flap
svg.appendChild(el('path',{
  d:`M${x1},${y1} L${x1+W},${y1} Q${x1+W},${y1+20} ${x1+W/2+50},${y1+22} Q${x1+W/2},${y1+28} ${x1+W/2-50},${y1+22} Q${x1},${y1+20} ${x1},${y1} Z`,
  fill:'#0f0e0c', stroke:CUT,'stroke-width':1.5
}));
svg.appendChild(text('BOTTOM TUCK FLAP',x1+W/2,y1+18,7,'rgba(201,168,92,.25)','middle','italic'));

// bottom side gussets
[[x0,x1],[x2,x2+D]].forEach(([lx,rx2],i)=>{
  const gw=D, gh=TH*0.75;
  const gx=i===0?x0:x2;
  svg.appendChild(rect(gx,y1,gw,gh,'#0f0e0c',CUT,1.5));
  if(i===0){
    svg.appendChild(el('path',{d:`M${gx},${y1+gh} L${gx+gw},${y1} M${gx},${y1} L${gx+gw},${y1}`,stroke:FOLD,'stroke-width':0.8,'stroke-dasharray':'4,4',fill:'none'}));
  } else {
    svg.appendChild(el('path',{d:`M${gx+gw},${y1+gh} L${gx},${y1} M${gx},${y1} L${gx+gw},${y1}`,stroke:FOLD,'stroke-width':0.8,'stroke-dasharray':'4,4',fill:'none'}));
  }
});

// fold lines vertical
[x0,x1,x2,x3,x4].forEach(x=>{
  svg.appendChild(line(x,0,x,totalH,FOLD,1,'6,4'));
});
// fold lines horizontal
svg.appendChild(line(0,y0,totalW,y0,FOLD,1,'6,4'));
svg.appendChild(line(0,y1,totalW,y1,FOLD,1,'6,4'));

// dimension labels
function dimLine(x1,y1,x2,y2,label){
  const g=el('g',{});
  g.appendChild(line(x1,y1,x2,y2,'rgba(201,168,92,.4)',0.8,'2,3'));
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const bg=el('rect',{x:mx-20,y:my-8,width:40,height:14,fill:'#111010',rx:2});
  g.appendChild(bg);
  g.appendChild(text(label,mx,my+4,8,'rgba(201,168,92,.5)'));
  svg.appendChild(g);
}
dimLine(x1,y0-10,x2,y0-10,'60mm');
dimLine(x2,y0-10,x3,y0-10,'60mm');
dimLine(x3,y0-10,x4,y0-10,'60mm');
dimLine(x4+2,y0,x4+2,y1,'90mm');

// outer cut line
svg.appendChild(rect(0,0,totalW,totalH,'none',CUT,1.5));

// ── VIEW TOGGLE ──────────────────────────────────────────
const v3d = document.getElementById('view-3d');
const vDL = document.getElementById('view-dieline');
const b3d = document.getElementById('btn3d');
const bDL = document.getElementById('btnDieline');
const bPDF = document.getElementById('btnPDF');

function scaleDieline(){
  const pad=80;
  const scaleX=(window.innerWidth-pad)/totalW;
  const scaleY=(window.innerHeight-140)/totalH;
  const s=Math.min(scaleX,scaleY,1.2);
  document.getElementById('dieline-wrap').style.transform=`scale(${s})`;
}
scaleDieline();
window.addEventListener('resize',scaleDieline);

b3d.addEventListener('click',()=>{
  v3d.style.display='flex'; vDL.style.display='none';
  b3d.classList.add('active'); bDL.classList.remove('active');
  bPDF.style.display='none';
});
bDL.addEventListener('click',()=>{
  vDL.style.display='flex'; v3d.style.display='none';
  bDL.classList.add('active'); b3d.classList.remove('active');
  bPDF.style.display='inline-block';
});

// ── PDF PRINT ────────────────────────────────────────────
bPDF.addEventListener('click', ()=>{
  const style = document.createElement('style');
  style.id = 'print-style';
  style.textContent = `
    @media print {
      body * { visibility: hidden !important; }
      #view-dieline, #view-dieline * { visibility: visible !important; }
      #dieline-wrap { visibility: visible !important; }
      #dieline-svg { visibility: visible !important; }
      #view-dieline {
        position: fixed !important;
        top: 0 !important; left: 0 !important;
        width: 100vw !important; height: 100vh !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        background: #111010 !important;
      }
      #dieline-wrap { transform: none !important; }
      #dieline-legend, #dl-hint, #nav { display: none !important; }
    }
  `;
  document.head.appendChild(style);
  window.print();
  setTimeout(()=>{ document.getElementById('print-style').remove(); }, 1000);
});
</script>
